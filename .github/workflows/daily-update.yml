name: Daily Limit-Up AI Update

on:
  schedule:
    # 每天北京时间 16:10 (UTC 8:10) 收盘后自动运行
    - cron: '10 8 * * 1,2,3,4,5'
  workflow_dispatch:  # 允许手动触发

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: 1

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install system deps (for akshare)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libxml2-dev libxslt1-dev 2>/dev/null || true

      - name: Install Python deps
        run: |
          pip install akshare scikit-learn numpy uvicorn fastapi

      - name: Verify akshare works
        run: python -c "import akshare as ak; df=ak.stock_zt_pool_em(date='20260805'); print(f'akshare OK, rows={len(df)}')"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install frontend deps
        run: cd frontend && npm install

      - name: Start backend & generate snapshots
        run: |
          cd backend
          python -m uvicorn app.main:app --host 0.0.0.0 --port 8008 > /tmp/backend.log 2>&1 &
          BACKEND_PID=$!
          echo "Backend PID: $BACKEND_PID"

          # wait for health check
          for i in $(seq 1 30); do
            if curl -s -o /dev/null -w "%{http_code}" http://localhost:8008/api/health | grep -q 200; then
              echo "Backend ready (attempt $i)"
              break
            fi
            sleep 2
          done

          # verify backend is up
          if ! curl -s http://localhost:8008/api/health; then
            echo "=== BACKEND FAILED TO START ==="
            cat /tmp/backend.log
            exit 1
          fi

          # generate snapshots
          python -m scripts.make_snapshot --limit-detail 60
          kill $BACKEND_PID 2>/dev/null || true

      - name: Build frontend
        run: |
          cd frontend
          npx vite build

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'frontend/dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
