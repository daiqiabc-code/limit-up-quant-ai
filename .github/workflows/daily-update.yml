name: Daily Limit-Up AI Update

on:
  schedule:
    # 每天北京时间 16:10 (UTC 8:10) 收盘后自动运行
    - cron: '10 8 * * 1,2,3,4,5'
  workflow_dispatch:  # 允许手动触发

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: 1
  SOURCE_MODE: akshare   # CI 无 .env，必须显式开启真实行情；抓取失败 ci_build 会自动降级模拟器

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install system deps (for akshare)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libxml2-dev libxslt1-dev 2>/dev/null || true

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install akshare scikit-learn numpy uvicorn fastapi

      - name: Verify akshare works
        run: python -c "import akshare as ak, datetime; d=datetime.date.today().strftime('%Y%m%d'); df=ak.stock_zt_pool_em(date=d); print(f'akshare OK, rows={len(df)}')" || echo "akshare verify skipped (CI 将自动降级)"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install frontend deps
        run: cd frontend && npm install

      - name: Generate data (no backend needed)
        run: |
          cd backend
          python -m scripts.ci_build

      - name: Build frontend
        run: |
          cd frontend
          rm -rf dist
          npx vite build

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'frontend/dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
